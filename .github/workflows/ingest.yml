name: Ingest Excel feed

# The source publishes a new Excel file every 5 minutes and this workflow
# follows that cadence. Each run downloads only the newest file, compares it
# with `stations_current` and writes just the stations whose price moved
# (measured on consecutive real files: ~8 rows per 5 minutes). A run therefore
# costs ~20 written rows instead of ~5,000, which keeps the D1 free tier
# (100,000 written rows/day) comfortable.
# See README.md -> "Cadence and quotas" before changing the schedule.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Never let two ingests run at once: a queued run is better than two runs
# racing on the same file.
concurrency:
  group: regie-essence-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Tests run on pushes and manual runs only. A scheduled run has to stay
      # short: 288 runs/day are billed as Actions minutes on a private repo.
      - name: Unit tests
        if: github.event_name != 'schedule'
        run: npm test

      # schema.sql only contains CREATE ... IF NOT EXISTS (plus one DROP VIEW /
      # CREATE VIEW), so it is safe on every run and repairs a database that
      # was created but never seeded.
      - name: Apply the D1 schema (idempotent)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run db:schema

      - name: Ingest the latest Excel file into D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_NAME: regie-essence
          RETENTION_DAYS: '14'
        run: npm run ingest
